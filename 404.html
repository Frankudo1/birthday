<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Franklin — Birthday Celebration</title>
    <meta name="description" content="Page not found. Return to Franklin — Birthday Celebration.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-md);
        }
        .error-content {
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            align-items: center;
        }
        .error-code {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 10vw, 8rem);
            color: var(--gold-champagne);
            line-height: 1;
            font-weight: 600;
        }
        .error-title {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--text-primary);
        }
        .error-message {
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .error-btn {
            text-decoration: none;
            padding: 0.875rem 2rem;
            font-size: 0.875rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: var(--transition);
            border: 1px solid var(--gold-champagne);
            color: var(--text-primary);
        }
        .error-btn:hover,
        .error-btn:focus {
            background-color: rgba(214, 180, 106, 0.1);
            outline: 2px solid var(--gold-champagne);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="index.html" class="error-btn">Return to Home</a>
        </div>
    </main>
</body>
</html>
